name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Where to run the Linux jobs. Self-hosted (the Mac mini's Ubuntu VM,
  # label `cherry-linux`) when it is online, GitHub-hosted otherwise — so a
  # power cut at the mini queues nothing: the run simply falls back to
  # ubuntu-latest and returns to the mini on its own once it is back. This job
  # never fails: any API error means "use GitHub-hosted".
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          online=$(gh api --paginate /orgs/disruptive-learning/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "cherry-linux"))] | length' \
            2>/dev/null || echo 0)
          if [ "${online:-0}" -gt 0 ]; then
            echo "self-hosted cherry-linux runner online ($online) — using it"
            echo 'linux=["self-hosted","cherry-linux"]' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no cherry-linux runner online — falling back to ubuntu-latest"
            echo 'linux="ubuntu-latest"' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Storybook
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.linux) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.linux) }}
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
